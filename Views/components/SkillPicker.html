<input class="form-control" id="skill-query" type="search" placeholder="e.g. C#, React, Figma" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="80" />
<ul class="selected-skills" aria-label="Selected skills"></ul>
<ul class="skill-suggestions" aria-label="Available skills"></ul>
<p class="field-hint" data-skill-status role="status"></p>
<template data-skill-select-template>
    <label class="form-label">
        <span></span>
        <select class="form-select">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
        </select>
    </label>
</template>
