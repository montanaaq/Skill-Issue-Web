<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up — skill_issue</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="preload" href="/static/fonts/jetbrains-mono/JetBrainsMonoNerdFontMono-Regular-Web.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/static/css/fonts.css" />
    {{#include components/ImportMap.html}}
        <script type="module" src="/static/js/shared/accent.js"></script>
        <link rel="stylesheet" href="/static/css/variables.css" />
        <link rel="stylesheet" href="/static/css/base.css" />
        <link rel="stylesheet" href="/static/css/ui.css" />
        <script type="module" src="/static/js/shared/dither-background.js"></script>
        <link rel="stylesheet" href="/static/css/pages/auth.css" />
        <script type="module" src="/static/js/pages/auth/index.js"></script>
</head>

<body>
    {{#include components/SiteHeader.html}}
        <main class="auth-main">
            <h1 id="form-title">Create your account</h1>
            <p class="auth-subtitle">Find teammates for your next project.</p>
            <noscript>
                <p class="alert alert-warning">
                    Enable JavaScript to sign up.
                </p>
            </noscript>
            <form action="/api/user/signup" method="post" data-auth-form="signup" aria-labelledby="form-title">
                <div class="alert alert-danger" id="form-error" role="alert" hidden></div>
                <div class="mb-4">
                    <label class="form-label" for="full-name">Full name</label>
                    <input class="form-control" type="text" id="full-name" name="fullName" autocomplete="name" placeholder="Your full name" maxlength="200" aria-describedby="fullName-error" required />
                    <div class="invalid-feedback" id="fullName-error"></div>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-control" type="email" id="email" name="email" autocomplete="username" spellcheck="false" autocapitalize="none" autocorrect="off" placeholder="you@example.com" maxlength="254" aria-describedby="email-error" required />
                    <div class="invalid-feedback" id="email-error"></div>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="password">Password</label>
                    <p class="form-text mt-0" id="password-hint">
                        15–128 characters. No spaces.
                    </p>
                    <input class="form-control" type="password" id="password" name="password" autocomplete="new-password" minlength="15" maxlength="128" pattern="\P{White_Space}+" aria-describedby="password-hint password-error" required />
                    <div class="invalid-feedback" id="password-error"></div>
                    <button class="btn btn-link password-toggle" type="button" data-password-toggle aria-controls="password" aria-pressed="false" hidden>
                        Show password
                    </button>
                </div>
                <button class="btn btn-primary w-100" type="submit" disabled>
                    Sign up
                </button>
            </form>
            <p class="auth-switch">
                Already have an account? <a href="/signin">Sign in</a>
            </p>
        </main>
</body>

</html>
